services:
  mongo-rs:
    image: mongo:7
    restart: unless-stopped
    networks:
      default: {}
      coolify:
        aliases:
          - mongo-rs-fyjdkptcvbhwg3gzibjmwwdf
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -eu
        umask 077
        printf '%s' "$$MONGO_REPLICA_KEY" > /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SERVICE_USER_MONGO}
      MONGO_INITDB_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MONGO}
      MONGO_REPLICA_KEY: ${SERVICE_REALBASE64_64_MONGO}
    volumes:
      - mongo_rs_data:/data/db
      - mongo_rs_config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo_rs_data:
  mongo_rs_config:

networks:
  coolify:
    external: true
    name: coolify
